name: Update level manifest

on:
  push:
    branches: [main]
    paths:
      - "levels/**/*.json"
      - "users/**/*.pub"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: manifest-update
  cancel-in-progress: false

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      # Uses a PAT, not the default GITHUB_TOKEN: GitHub deliberately does
      # NOT fire pull_request events for PRs opened with the default token
      # (anti-loop guard), which would mean validate-level-pr.yml never runs
      # on this PR and --auto merge sits pending forever. Create a
      # fine-grained PAT scoped to just this repo with Contents: read/write
      # and Pull requests: read/write, then add it as a repo secret named
      # MANIFEST_PR_TOKEN (Settings -> Secrets and variables -> Actions).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -- build_manifest.py reads each level's git commit date to sort newest-first
          token: ${{ secrets.MANIFEST_PR_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - run: python scripts/build_manifest.py

      - id: diff
        run: |
          git add meta/manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Goes through the same PR path as everything else -- this repo no
      # longer allows direct pushes to main at all, bot included. The PR
      # this opens only ever touches meta/manifest.json by itself, which is
      # exactly what validate-level-pr.yml's manifest-only path checks and
      # auto-merges, so no bypass permissions are needed anywhere.
      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MANIFEST_PR_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="manifest-update-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$BRANCH"
          git commit -m "update levels manifest"
          git push origin "$BRANCH"
          gh pr create \
            --title "Update levels manifest" \
            --body "Automated manifest rebuild triggered by ${{ github.sha }}." \
            --base main --head "$BRANCH"
          gh pr merge --squash --auto "$BRANCH" --repo "${{ github.repository }}"
