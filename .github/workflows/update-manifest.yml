name: Update level manifest

on:
  push:
    branches: [main]
    paths:
      - "levels/**/*.json"
      - "users/**/*.pub"

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - run: python scripts/build_manifest.py

      # NOTE: this pushes straight to main. If branch protection has "require
      # a pull request before merging" turned on, this push will be rejected
      # unless you exempt the Actions bot: Settings -> Rules -> your
      # ruleset -> Bypass list -> add "GitHub Actions" (or Settings ->
      # Branches -> classic protection -> "Allow specified actors to bypass
      # required pull requests" -> add the github-actions app).
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meta/manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "update levels manifest"
            git push
          fi
